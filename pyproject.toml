[tool.poetry]
name = "hms"
version = "0.6.0"
description = "Data server for the second iteration of SCIP"
authors = [
  "James Hiebert <hiebert@uvic.ca>",
  "Quintin Sparks <quintins@uvic.ca>",
  "Lee Zeman <lzeman@uvic.ca>",
]
license = "GPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.1.2"
flask-sqlalchemy = "^3.1.1"
psycopg2 = "^2.9.12"
flask-cors = "^6.0.1"
connexion = { extras = ["swagger-ui", "flask", "uvicorn"], version = "^3.3.0" }
uvicorn = "^0.34.0"
# Temporary pin: return to the default branch after hydromosaic-db PR #12 merges.
# https://github.com/pacificclimate/hydromosaic-db/pull/12
hydromosaic = { git = "https://github.com/pacificclimate/hydromosaic-db.git", rev = "b7dfbe1734d4e798c89a6d48bf425970a4a830d2" }
netcdf4 = "^1.7.3"
black = "^26.5.1"

[tool.black]
required-version = "26.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
